name: Phase 7 publication finalization

on:
  push:
    branches:
      - phase7-publication-source-hygiene-20260916
    paths:
      - .phase7-finalize-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/pipeline/requirements.txt

      - name: Apply PHASE 7 publication canonicalization
        run: python tools/maintenance/finalize_phase7_publication.py --apply

      - name: Verify governed knowledge was not changed
        run: git diff --exit-code -- knowledge

      - name: Validate knowledge graph and release gate
        run: |
          python tools/v4/validate_all.py
          python tools/v4/strict_release_audit.py

      - name: Run compatibility and pipeline tests
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tools/pipeline/tests -v

      - name: Rebuild and verify fresh current bundle
        shell: bash
        run: |
          rm -rf source/releases/current source/releases/site-selection.json
          DATA_VERSION="$(date -u +%Y.%m.%d).${GITHUB_SHA::12}.phase7"
          python tools/v4/build_unified_release.py --out source/releases/current --as-of "$(date -u +%F)" --data-version "${DATA_VERSION}"
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('source/releases/current/release.json').read_text(encoding='utf-8'))
          Path('source/releases/site-selection.json').write_text(
              json.dumps({
                  'schemaVersion':'safety-site-selection-v1',
                  'bundle':'current',
                  'releaseHash':release['releaseHash']
              }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          python tools/v4/verify_unified_bundle.py --bundle source/releases/current

      - name: Commit PHASE 7 publication source changes only
        shell: bash
        run: |
          git config user.name "phase7-finalizer"
          git config user.email "phase7-finalizer@users.noreply.github.com"
          git add source/publication docs/PHASE7_PUBLICATION_AUDIT.md docs/phase7-publication-audit.json
          if git diff --cached --quiet; then
            echo "No PHASE 7 publication changes to commit"
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^(source/publication/|docs/PHASE7_PUBLICATION_AUDIT\.md$|docs/phase7-publication-audit\.json$)' ; then
            echo "Unexpected staged path" >&2
            exit 1
          fi
          git commit -m "Phase 7: canonicalize publication sources"
          git push
