name: CF duplicate audit (read only)
on:
  push:
    branches: [audit/engineering-20260920]
    paths:
      - tools/audit/cf_duplicate_audit.py
      - .github/workflows/cf-duplicate-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/engineering-20260920
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute CF duplicate candidates
        run: python tools/audit/cf_duplicate_audit.py
