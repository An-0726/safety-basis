name: Phase 6 candidate evidence finalization

on:
  push:
    branches: [phase6-candidate-evidence-backlog-20260916]
    paths:
      - '.phase6-finalize-trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-candidate-evidence-backlog-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/pipeline/requirements.txt
      - name: Apply conservative PHASE 6 final disposition
        run: python tools/maintenance/finalize_phase6.py --apply
      - name: Validate knowledge graph and release gate
        run: |
          python tools/v4/validate_all.py
          python tools/v4/strict_release_audit.py
      - name: Run compatibility and pipeline tests
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tools/pipeline/tests -v
      - name: Rebuild and verify fresh current bundle
        run: |
          rm -rf source/releases/current source/releases/site-selection.json
          DATA_VERSION="$(date -u +%Y.%m.%d).${GITHUB_SHA::12}.phase6"
          python tools/v4/build_unified_release.py --out source/releases/current --as-of "2026-09-16" --data-version "${DATA_VERSION}"
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('source/releases/current/release.json').read_text(encoding='utf-8'))
          Path('source/releases/site-selection.json').write_text(json.dumps({'schemaVersion':'safety-site-selection-v1','bundle':'current','releaseHash':release['releaseHash']}, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          python tools/v4/verify_unified_bundle.py --bundle source/releases/current
      - name: Commit PHASE 6 governed-source changes only
        run: |
          git config user.name "phase6-finalizer"
          git config user.email "phase6-finalizer@users.noreply.github.com"
          git add knowledge docs/PHASE6_FINAL_DISPOSITION.md docs/phase6-final-disposition.jsonl
          git diff --cached --check
          git commit -m "Phase 6: finalize candidate evidence rebind"
          git push origin HEAD:phase6-candidate-evidence-backlog-20260916
