name: Build architecture-v2 derived data

on:
  push:
    branches: [architecture-v2]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate data
        run: node tools/build-data.mjs
      - name: Commit derived runtime data when changed
        run: |
          if ! git diff --quiet -- data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "build: regenerate v2 runtime data"
            git push origin HEAD:architecture-v2
          fi
