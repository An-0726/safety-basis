name: Commerce full match audit
on:
  push:
    branches: [audit/commerce-full-ingest-20260921]
    paths:
      - tools/audit/commerce_full_candidates_20260921.json
      - tools/audit/commerce_full_match.py
      - .github/workflows/commerce-full-match.yml
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/commerce-full-ingest-20260921
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match commerce candidates against knowledge
        run: |
          mkdir -p "${RUNNER_TEMP}/commerce-match"
          python tools/audit/commerce_full_match.py --out "${RUNNER_TEMP}/commerce-match/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: commerce-full-match-report
          path: ${{ runner.temp }}/commerce-match/report.json
          if-no-files-found: error
          retention-days: 7
