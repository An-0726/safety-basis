name: Apply commerce full ingest
on:
  push:
    branches: [audit/commerce-full-ingest-20260921]
    paths:
      - tools/audit/apply_commerce_full_ingest.py
      - .github/workflows/apply-commerce-full-ingest.yml
permissions:
  contents: write
concurrency:
  group: commerce-full-ingest
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/commerce-full-ingest-20260921
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/pipeline/requirements.txt
      - name: Apply full commerce ingest
        run: python tools/audit/apply_commerce_full_ingest.py
      - name: Full gates
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tools/pipeline/tests -v
          python tools/v4/validate_all.py
          python tools/v4/strict_release_audit.py
          python tools/v4/validate_publication_integrity.py
      - name: Build and verify
        run: |
          rm -rf source/releases/commerce-full
          python tools/v4/build_unified_release.py --out source/releases/commerce-full --as-of 2026-09-21 --data-version "commerce-full-${GITHUB_SHA}"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('source/releases/commerce-full/release.json').read_text(encoding='utf-8'))
          Path('source/releases/commerce-full-selection.json').write_text(json.dumps({'schemaVersion':'safety-site-selection-v1','bundle':'commerce-full','releaseHash':r['releaseHash']},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python tools/v4/verify_unified_bundle.py --bundle source/releases/commerce-full --selection source/releases/commerce-full-selection.json
      - name: Commit governed changes
        run: |
          git add -- knowledge docs/COMMERCE_FULL_INGEST_20260921.md docs/commerce-ingest-map-20260921.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git config user.name ChatGPT
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: ingest full commerce inspection hazard set'
          git push origin HEAD:refs/heads/audit/commerce-full-ingest-20260921
