name: Apply reviewed field-audit increment

on:
  push:
    branches: [maintenance/20260926-full-source-audit]
    paths: [.github/workflows/task-apply-reviewed-increment.yml]

permissions:
  contents: write

jobs:
  apply-reviewed-increment:
    if: github.repository == 'An-0726/safety-basis' && github.ref == 'refs/heads/maintenance/20260926-full-source-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact branch ancestry and apply public-only reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "f1e3d41299c29f7c700c48bc891799e1022dc070"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "72fd38489a54e8797da4a757690c1ab9f241b040"
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          blobs = [
              '90c999eee026975d83fe413baf093987ff66b31a',
              'cb9a0cc15691258f487fce4cbc7d65f9915b76b2',
              '4fea4982a2c60ac62f537cfa25bdfefd5784a3be',
          ]
          parts = []
          for sha in blobs:
              result = json.loads(subprocess.check_output(['gh','api',f'repos/An-0726/safety-basis/git/blobs/{sha}']))
              raw = base64.b64decode(result['content'])
              actual = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if actual != sha:
                  raise SystemExit('Transfer blob hash mismatch')
              parts.append(raw)
          patch = lzma.decompress(b''.join(parts))
          if hashlib.sha256(patch).hexdigest() != '5ed99f7b9e148a37489b6120b87b7a5098e51f1e2814923643ca17fafe321e83':
              raise SystemExit('Reviewed patch hash mismatch')
          target = pathlib.Path(os.environ['RUNNER_TEMP'])/'reviewed-public-increment.patch'
          target.write_bytes(patch)
          subprocess.run(['git','apply','--index','--check',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          names = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          for name in names:
              if not (name == 'README.md' or name.startswith('docs/') or name.startswith('knowledge/') or name == 'source/publication/law-index.json' or name == 'tools/v4/strict_release_audit.py'):
                  raise SystemExit('Unexpected patch target: '+name)
          if len(names) != 115:
              raise SystemExit('Unexpected changed file count: '+str(len(names)))
          print('Verified public increment:', len(names), 'files; no private source documents transferred')
          PY
          git rm .github/workflows/task-audit-snapshot.yml .github/workflows/task-apply-reviewed-increment.yml
      - name: Recheck the reviewed increment before committing
        run: |
          python -m pip install -r tools/pipeline/requirements.txt
          python tools/v4/validate_all.py
          python tools/v4/strict_release_audit.py --as-of 2026-09-26
          python tools/v4/validate_publication_integrity.py
          node --test tests/*.test.mjs
          python -m unittest discover -s tools/pipeline/tests -v
      - name: Commit only to the authorized maintenance branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/maintenance/20260926-full-source-audit | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "72fd38489a54e8797da4a757690c1ab9f241b040"
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'fix: verify field-derived hazards and preserve incomplete source audit'
          git push origin HEAD:refs/heads/maintenance/20260926-full-source-audit
