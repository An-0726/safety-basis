name: Apply PR70 disposition (one shot)
on:
  push:
    branches: [audit/engineering-20260920]
    paths:
      - tools/audit/dispose_cf_pr70.py
      - .github/workflows/apply-cf-disposition.yml
permissions:
  contents: write
concurrency:
  group: apply-cf-pr70-disposition
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/engineering-20260920
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/pipeline/requirements.txt
      - name: Apply PR70 disposition
        run: python tools/audit/dispose_cf_pr70.py
      - name: Run gates
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tools/pipeline/tests -v
          python tools/v4/validate_all.py
          python tools/v4/strict_release_audit.py
          python tools/v4/validate_publication_integrity.py
      - name: Build and verify
        run: |
          rm -rf source/releases/pr70-audit
          python tools/v4/build_unified_release.py --out source/releases/pr70-audit --as-of 2026-09-21 --data-version "pr70-audit-${GITHUB_SHA}"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('source/releases/pr70-audit/release.json').read_text(encoding='utf-8'))
          Path('source/releases/pr70-audit-selection.json').write_text(json.dumps({'schemaVersion':'safety-site-selection-v1','bundle':'pr70-audit','releaseHash':r['releaseHash']},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python tools/v4/verify_unified_bundle.py --bundle source/releases/pr70-audit --selection source/releases/pr70-audit-selection.json
      - name: Commit reviewed disposition
        run: |
          git add -- knowledge
          if git diff --cached --quiet; then exit 0; fi
          git config user.name ChatGPT
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: disposition PR70 generated hazards'
          git push origin HEAD:refs/heads/audit/engineering-20260920
