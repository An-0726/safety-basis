name: Phase 11 state refresh

on:
  push:
    branches: [phase11-state-refresh-20260917]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase11-state-refresh-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact state refresh
        run: python tools/maintenance/phase11_state_refresh_once.py
      - name: Commit refreshed state and remove one-shot maintenance files
        shell: bash
        run: |
          rm tools/maintenance/phase11_state_refresh_once.py
          rm .github/workflows/phase11-state-refresh.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md docs/ARCHITECTURE.md docs/CANDIDATE_REVIEW.md tools/maintenance/phase11_state_refresh_once.py .github/workflows/phase11-state-refresh.yml
          git commit -m "Phase 11: synchronize current governance state"
          git push origin HEAD:phase11-state-refresh-20260917
