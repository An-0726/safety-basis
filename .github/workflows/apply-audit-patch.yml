name: Apply reviewed audit patch (one shot)
on:
  push:
    branches: [audit/engineering-20260920]
    paths: [tools/audit/ui-routing.patch, .github/workflows/apply-audit-patch.yml]
permissions:
  contents: write
concurrency:
  group: apply-reviewed-engineering-patch
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'An-0726/safety-basis' && github.ref == 'refs/heads/audit/engineering-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/engineering-20260920
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed patch and verify output fingerprints
        run: |
          test -z "$(git status --porcelain)"
          echo '26c6c33d0ecea12858d76ae4bd30e6f23db93268c47f6227e6c16f7440a4daf9  tools/audit/ui-routing.patch' | sha256sum --check
          if git apply --reverse --check tools/audit/ui-routing.patch 2>/dev/null; then
            echo 'Patch already applied; no mutation.'
            exit 0
          fi
          git apply --check tools/audit/ui-routing.patch
          git apply tools/audit/ui-routing.patch
          python - <<'PY'
          import subprocess
          expected = {'web/app.js':'abb5c9566ce8c8cb7c759bd4bef9f3782e4c5844', 'tools/browser/audit_browser.py':'7989a0148528f6aa3828d9f6f4c07888924e6ebf', 'tests/results-interaction.test.mjs':'1233811044cd9c58bc887248707971f9ef39e38b', 'tests/routing.test.mjs':'5e738ab9958a823b6b8ffad50db5a6151b800dd3'}
          for path, digest in expected.items():
              assert subprocess.check_output(['git','hash-object',path], text=True).strip() == digest, path
          PY
      - name: Test before committing
        run: |
          node --test tests/*.test.mjs
          python -m py_compile tools/browser/audit_browser.py
      - name: Commit only the four reviewed files without force push
        run: |
          git add -- web/app.js tools/browser/audit_browser.py tests/results-interaction.test.mjs tests/routing.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name ChatGPT
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve filter URLs and navigation; make browser assertions CSP-safe'
          git push origin HEAD:refs/heads/audit/engineering-20260920
