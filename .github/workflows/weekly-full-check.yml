name: Weekly full browser check

on:
  schedule:
    - cron: '0 19 * * 6'   # Sunday 03:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full_browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Open every published rule on the live site
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tools/checks/browser_smoke.py --url https://an-0726.github.io/safety-basis/ --all \
            --out "${RUNNER_TEMP}/browser/full.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-full-browser-check
          path: ${{ runner.temp }}/browser
          if-no-files-found: warn
          retention-days: 14
