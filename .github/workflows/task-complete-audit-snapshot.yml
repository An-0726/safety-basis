name: Temporary complete field audit snapshot
on:
  push:
    branches: [maintenance/20260926-complete-field-audit]
    paths: [.github/workflows/task-complete-audit-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f9e9537283857ac52d24a6fd02903e7f03da78c
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/complete-field-audit"
          git archive --format=zip HEAD -o "${RUNNER_TEMP}/complete-field-audit/current-tracked-source.zip"
          git rev-parse HEAD > "${RUNNER_TEMP}/complete-field-audit/source-commit.txt"
          sha256sum "${RUNNER_TEMP}/complete-field-audit/current-tracked-source.zip" > "${RUNNER_TEMP}/complete-field-audit/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: complete-field-audit-source-8f9e953
          path: ${{ runner.temp }}/complete-field-audit/
          if-no-files-found: error
          retention-days: 1
