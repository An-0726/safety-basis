name: Phase 9 release candidate validation

on:
  push:
    branches:
      - phase9-release-candidate-20260917
    paths:
      - .phase9-rc-trigger

permissions:
  contents: write

jobs:
  rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/pipeline/requirements.txt

      - name: Run frontend and pipeline test suites
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tools/pipeline/tests -v

      - name: Validate governed knowledge and strict release gate
        run: |
          python tools/v4/validate_all.py
          python tools/v4/strict_release_audit.py

      - name: Build and verify fresh Release Candidate bundle
        shell: bash
        run: |
          rm -rf source/releases/current source/releases/site-selection.json dist
          DATA_VERSION="$(date -u +%Y.%m.%d).${GITHUB_SHA::12}.rc"
          python tools/v4/build_unified_release.py --out source/releases/current --as-of "$(date -u +%F)" --data-version "${DATA_VERSION}"
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('source/releases/current/release.json').read_text(encoding='utf-8'))
          Path('source/releases/site-selection.json').write_text(
              json.dumps({
                  'schemaVersion':'safety-site-selection-v1',
                  'bundle':'current',
                  'releaseHash':release['releaseHash']
              }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          python tools/v4/verify_unified_bundle.py --bundle source/releases/current
          python tools/maintenance/audit_phase8_consistency.py --bundle source/releases/current --output /tmp/phase9-phase8-audit.json

      - name: Record Release Candidate public validation
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('.')
          release = json.loads((root/'source/releases/current/release.json').read_text(encoding='utf-8'))
          manifest = json.loads((root/'source/releases/current/data/manifest.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('/tmp/phase9-phase8-audit.json').read_text(encoding='utf-8'))
          payload = {
              'schemaVersion': 'phase9-rc-public-v1',
              'phase': 9,
              'status': 'PASS',
              'sourceCommit': os.environ['GITHUB_SHA'],
              'asOf': release.get('asOf'),
              'dataVersion': manifest.get('dataVersion'),
              'releaseHash': release.get('releaseHash'),
              'counts': release.get('counts', {}),
              'knowledgeGate': release.get('knowledge', {}).get('gate', {}),
              'phase8Consistency': audit,
              'checks': {
                  'nodeTests': 'PASS',
                  'pipelineTests': 'PASS',
                  'validateAll': 'PASS',
                  'strictReleaseAudit': 'PASS',
                  'freshUnifiedBuild': 'PASS',
                  'verifyUnifiedBundle': 'PASS',
                  'phase8RegressionAudit': 'PASS'
              },
              'privateLocalBuild': 'PENDING_LOCAL_ONLY',
              'publicationBoundary': 'knowledge/source publication/web unchanged by validation'
          }
          Path('docs/phase9-rc-public.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Ensure validation did not mutate governed sources
        shell: bash
        run: |
          git diff --exit-code -- knowledge source/publication web tools
          git diff --check

      - name: Commit Phase 9 public RC report only
        shell: bash
        run: |
          git config user.name "phase9-rc"
          git config user.email "phase9-rc@users.noreply.github.com"
          git add docs/phase9-rc-public.json
          git diff --cached --quiet && { echo 'No RC report change'; exit 1; }
          if git diff --cached --name-only | grep -Ev '^docs/phase9-rc-public\.json$' ; then
            echo "Unexpected staged path" >&2
            exit 1
          fi
          git commit -m "Phase 9: record public RC validation"
          git push

      - name: Remove generated release before source snapshot
        shell: bash
        run: rm -rf source/releases/current source/releases/site-selection.json dist

      - name: Upload Phase 9 source snapshot for local-only build
        uses: actions/upload-artifact@v4
        with:
          name: phase9-source-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            AGENTS.md
            README.md
            LICENSE
            docs
            knowledge
            source
            tests
            tools
            web
