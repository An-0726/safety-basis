name: Validate pipeline prototype
on:
  push:
    branches: [data-verify-batch-003]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/pipeline/requirements.txt
      - run: python -m unittest discover -s tools/pipeline/tests -v
      - run: python -m unittest discover -s tests -v
      - name: Migrate the complete legacy dataset into a private temporary master
        run: python tools/pipeline/master.py migrate
      - name: Verify lossless migration against source and archives
        run: python tools/pipeline/master.py verify --db source/master/safety.sqlite3
      - name: Verify a repeated migration is safe
        run: python tools/pipeline/master.py migrate
      - name: Export a versioned Excel snapshot from the temporary master
        run: python tools/pipeline/exchange.py export --output "${{ runner.temp }}/safety-master.xlsx"
      - name: Validate an unchanged workbook without applying edits
        run: python tools/pipeline/exchange.py propose --workbook "${{ runner.temp }}/safety-master.xlsx" --output "${{ runner.temp }}/safety-proposal.json"
      - name: Restore legacy files without replacing the checkout
        run: python tools/pipeline/master.py restore --db source/master/safety.sqlite3 --output "${{ runner.temp }}/safety-legacy-restored"
      - run: node --test tools/tests/*.test.mjs
      - name: Keep legacy sources and website output unchanged
        run: git diff --exit-code -- content data
