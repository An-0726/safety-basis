name: Validate pipeline prototype
on:
  push:
    branches: [data-verify-batch-003]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/pipeline/requirements.txt
      - run: python -m unittest discover -s tools/pipeline/tests -v
      - run: python -m unittest discover -s tests -v
      - name: Migrate the complete legacy dataset into a private temporary master
        run: python tools/pipeline/master.py migrate
      - name: Verify lossless migration against source and archives
        run: python tools/pipeline/master.py verify --db source/master/safety.sqlite3
      - name: Verify a repeated migration is safe
        run: python tools/pipeline/master.py migrate
      - name: Export a versioned Excel snapshot from the temporary master
        run: python tools/pipeline/exchange.py export --output "${{ runner.temp }}/safety-master.xlsx"
      - name: Validate an unchanged workbook without applying edits
        run: python tools/pipeline/exchange.py propose --workbook "${{ runner.temp }}/safety-master.xlsx" --output "${{ runner.temp }}/safety-proposal.json"
      - name: Restore legacy files without replacing the checkout
        run: python tools/pipeline/master.py restore --db source/master/safety.sqlite3 --output "${{ runner.temp }}/safety-legacy-restored"
      - name: Rebuild the reviewed pilot snapshot without the private master
        run: python tools/pipeline/manage.py build --release source/releases/pilot-20260909/release.json --output "${{ runner.temp }}/safety-pilot-build"
      - name: Rebuild the same snapshot a second time
        run: python tools/pipeline/manage.py build --release source/releases/pilot-20260909/release.json --output "${{ runner.temp }}/safety-pilot-rebuild"
      - name: Verify deterministic pilot output
        run: diff -r "${{ runner.temp }}/safety-pilot-build" "${{ runner.temp }}/safety-pilot-rebuild"
      - run: node --test tools/tests/*.test.mjs tests/*.test.mjs
      - name: Keep legacy sources and website output unchanged
        run: git diff --exit-code -- content data
      - name: Validate the reviewed website package and full-text hashes
        run: python tools/pipeline/manage.py verify-site --output source/releases/reviewed-20260909
      - name: Rebuild the reviewed core data without private sources
        run: python tools/pipeline/manage.py build --release source/releases/reviewed-20260909/release.json --output "${{ runner.temp }}/safety-reviewed-build"
      - name: Compare the rebuilt public core data
        run: diff -r --exclude=fulltext "${{ runner.temp }}/safety-reviewed-build/data" source/releases/reviewed-20260909/data
