name: Validate data branches

on:
  push:
    branches:
      - 'data-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # One-time migration scripts remain archived; CI cannot rewrite statuses.
      - name: Test public gate in isolated fixtures
        run: node --test tools/tests/*.test.mjs
      - name: Build and validate data
        run: node tools/build-data.mjs
      - name: Ensure generated data is committed
        run: git diff --exit-code -- data
