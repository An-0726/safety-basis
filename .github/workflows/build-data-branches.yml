name: Build data branches

on:
  push:
    branches:
      - 'data-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Batch 003 verification migration
        run: node tools/migrations/verify-batch-003.mjs
      - name: Build and validate data
        run: node tools/build-data.mjs
      - name: Commit verified source and generated runtime data when changed
        run: |
          if ! git diff --quiet -- content/batches data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/batches data
            git commit -m "data: verify batch 003 and regenerate runtime"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
