name: Record verified field increment state
on:
  push:
    branches: [docs/20260926-verified-field-state]
    paths: [.github/workflows/task-record-online-state.yml]
permissions:
  contents: write
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check live release and completed Actions before recording facts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "docs/20260926-verified-field-state"
          test "$(git rev-parse HEAD^)" = "eceaf9cfa45b02b469620e3d938b9f105dd93606"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "eceaf9cfa45b02b469620e3d938b9f105dd93606"
          python - <<'PY'
          import collections,datetime,hashlib,io,json,pathlib,re,subprocess,time,urllib.request,zipfile
          ROOT=pathlib.Path.cwd()
          REPO='An-0726/safety-basis'
          BASE='eceaf9cfa45b02b469620e3d938b9f105dd93606'
          HASH='b434abeed503709615bade08ce3b43e02802e9be7cc9d983b68b7565e856b3bc'
          EXPECT={'hazards':1706,'laws':62,'lawVersions':62,'clauses':1336,'links':1825}
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{REPO}/'+path]))
          runs={}
          for run_id in (36210224851,36210224805):
              run=api(f'actions/runs/{run_id}')
              assert run['head_sha']==BASE and run['status']=='completed' and run['conclusion']=='success', 'Actions not successfully completed for exact revision'
              jobs=api(f'actions/runs/{run_id}/jobs')['jobs']
              assert all(j['conclusion']=='success' for j in jobs)
              runs[str(run_id)]={'url':run['html_url'],'headSha':run['head_sha'],'conclusion':run['conclusion'],'completedAt':run['updated_at'],'jobs':{j['name']:j['conclusion'] for j in jobs}}
          raw_browser=subprocess.check_output(['gh','api',f'repos/{REPO}/actions/artifacts/10895775105/zip'])
          with zipfile.ZipFile(io.BytesIO(raw_browser)) as z:
              browser=json.loads(z.read('browser-public.json'))
          assert browser['failed']==0 and browser['passed']==17
          assert all(check['pass'] for check in browser['checks'])
          full=next(c['evidence'] for c in browser['checks'] if c['name']=='all_published_hazards_laws_quotes_and_counts')
          assert full['expected']==EXPECT and not full['errors']
          base_url='https://an-0726.github.io/safety-basis/'
          def live(path):
              request=urllib.request.Request(base_url+path+'?audit='+str(time.time_ns()),headers={'Cache-Control':'no-cache','User-Agent':'safety-basis-state-audit'})
              with urllib.request.urlopen(request,timeout=40) as response:
                  assert response.status==200
                  return json.loads(response.read())
          release=live('release.json')
          manifest=live('data/manifest.json')
          assert release['releaseHash']==manifest['releaseHash']==HASH
          assert release['asOf']=='2026-09-26' and release['counts']==manifest['counts']==EXPECT
          assert manifest['dataVersion']=='2026.09.26.eceaf9cfa45b'
          assert release['knowledge']['gate']['publicProposalHazards']==0
          km=json.loads((ROOT/'knowledge/manifest.json').read_text())
          assert km['counts']=={'laws':107,'lawVersions':110,'clauses':3000,'hazards':2127,'links':1959,'evidence':1209,'successions':26,'requirements':75}
          assert km['lifecycle']=={'active':1706,'proposed':324,'superseded':97}
          manifest_sha=hashlib.sha256((ROOT/'knowledge/manifest.json').read_bytes()).hexdigest()
          assert release['knowledge']['manifestSha256']==manifest['sourceRevision']==manifest_sha
          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).isoformat(timespec='seconds')
          proof={'schemaVersion':'field-increment-online-proof-v1','checkedAt':now,'taskComplete':False,'scope':'This curated increment and its deterministic release are deployed; all-2026 source review remains incomplete.','dataMergeCommit':'520023209c9329cf76ffb5fdc24728163e56f84d','verifiedBuildCommit':BASE,'pullRequests':[83,84],'releaseHash':HASH,'asOf':release['asOf'],'dataVersion':manifest['dataVersion'],'manifestSha256':manifest_sha,'knowledgeCounts':km['counts'],'lifecycle':km['lifecycle'],'publicCounts':EXPECT,'publicProposed':0,'checks':{'directLiveHttp':True,'liveReleaseAndManifestHashMatch':True,'liveManifestMatchesKnowledge':True,'allActionsExactHeadSuccess':True,'browserPassed':17,'browserFailed':0,'localAndRemoteBusinessDataByteIdentical':True},'actions':runs,'browserArtifactId':10895775105,'browserEvidence':browser,'remainingUnreviewedRows':725,'strictBlockers':0,'strictInventoryWarnings':140}
          (ROOT/'docs/ONLINE_VERIFY_20260926_FIELD_INCREMENT.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          block=f'''<!-- CURRENT_STATE_BEGIN -->
          ## 当前统一状态（2026-09-26，已部署的受控增量；全量任务未完成）

          `knowledge/manifest.json`：**107 laws / 110 law versions / 3,000 clauses / 2,127 hazards / 1,959 links / 1,209 evidence / 26 successions / 75 requirements**；生命周期 **1,706 active / 324 proposed / 97 superseded**。

          正式网站已验收：**1,706 hazards / 62 laws / 62 law versions / 1,336 clauses / 1,825 links / public proposed 0**，`asOf=2026-09-26`；`releaseHash={HASH}`。该哈希来自实际公网`release.json`及`data/manifest.json`交叉核验，不是仅本地构建值。

          可追溯验收锚点：知识增量PR #83合并`520023209c9329cf76ffb5fdc24728163e56f84d`；确定性构建修复PR #84合并`{BASE}`；对应main Validate `36210224851`及Build/Pages/Online Verify `36210224805`全部成功，真实Chromium浏览器17项通过、0项失败。公网直接核验时间：`{now}`。状态文档后续提交不冒充新的业务数据提交，也不将上述验收锚点误称为永不变化的当前main。完整凭证见`docs/ONLINE_VERIFY_20260926_FIELD_INCREMENT.json`。

          本批新增**6个隐患实体（1 active、5 proposed）**，另将既有气瓶防倾倒候选**1条转正**；新增**2 laws / 2 versions / 4 clauses / 4 links / 7 evidence**。叉车钥匙条款和关联仍待原页证据复核；供应方说明书义务不替代使用单位义务，一般报警故障不自动认定为重大事故隐患。

          2026全量项目任务**尚未完成**：已登记**43份来源载体**（40份有2026正文或同项目正文关联、2份日期待核、1份归属冲突），形成**782条原始记录行**；其中**45条完成细分处置、12条排除、725条待逐条审核**。45条形成55项处置，已定位**39个不同canonical实体**（既有active 13、既有proposed 17、沿superseded/mergedInto归并3、真缺口6）；另有6个细分事项待事实或依据核实。39不是782行的最终去重数，43也不是独立项目数或全盘扫描完成证明。

          来源纠错：审阅稿110项符合带有预填且未经现场核实说明，不能证明现场零隐患；某评分表与另一来源70条描述完全相同，已隔离归属冲突；往年事实、正向表述却扣分、纯照片镜像、未见标志不等于未检等均不直接转为现场隐患。原文件未渲染、未生成预览、未转换格式。

          技术验收：71项前端测试、55项流水线测试通过；严格发布审计0阻断、140项库存告警，不能据此宣称全库无质量问题。实体发现顺序反转及不同Python哈希种子的两次构建，数据文件逐字节一致；跨环境依据排序和条款分片导致的哈希漂移已修复。

          恢复入口：`docs/FIELD_SOURCE_AUDIT_20260926.md`、`docs/field-source-progress-20260926.json`、`docs/field-source-disposition-20260926.jsonl`。私有源文件标识、原始文本、企业及个人信息不进入GitHub。此前日期、数量、提交和发布哈希均仅为各自历史阶段数据，不覆盖本块当前业务统计。
          <!-- CURRENT_STATE_END -->'''
          block='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          for name in ('README.md','docs/PROJECT_STATE.md','docs/HANDOFF.md'):
              p=ROOT/name;s=p.read_text();assert s.count('<!-- CURRENT_STATE_BEGIN -->')==s.count('<!-- CURRENT_STATE_END -->')==1
              s,n=re.subn(r'<!-- CURRENT_STATE_BEGIN -->.*?<!-- CURRENT_STATE_END -->',lambda _:block,s,flags=re.S);assert n==1;p.write_text(s)
          audit=ROOT/'docs/FIELD_SOURCE_AUDIT_20260926.md'
          with audit.open('a') as f:
              f.write(f'\n## 已完成的远端发布与确定性纠错（{now}）\n\nPR #83于09:50:19创建、09:51:21合并，main Validate 36209811863和Build/Pages/Online 36209811859成功，09:52:44完成17项真实浏览器检查。该历史部署哈希为346cdc736cda19556d94eb3e404cc7ad5dcb5038feac09dd595d22824d51e7dd，并非前述本地哈希。逐实体核对未发现业务内容差异，差异来自多依据排序和条款分片受文件读取顺序影响。\n\nPR #84于09:58:09创建、09:59:09合并，仅修复确定性构建和增加1项回归测试，不改变知识实体或审核决定。main Validate 36210224851、Build/Pages/Online 36210224805均成功；最终验收哈希为`{HASH}`，与本地修复包一致。全部data业务文件跨环境逐字节相同（时间戳及dataVersion所在manifest除外）。17项公网浏览器检查全通过；本次文档回填前再次直接读取公网release及manifest，哈希、数量、知识manifest指纹均一致。\n\n本次为上线后的状态文档回填，不新增隐患。前三份状态文档的CURRENT_STATE块保持一致，历史本地值只留作故障审计。43来源/782原始行/45审核/12排除/725待审范围不变，全量任务未关闭。\n')
          expected={'README.md','docs/PROJECT_STATE.md','docs/HANDOFF.md','docs/FIELD_SOURCE_AUDIT_20260926.md','docs/ONLINE_VERIFY_20260926_FIELD_INCREMENT.json'}
          subprocess.run(['git','add',*sorted(expected)],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==expected
          print('Live release verified before writing state:',HASH,EXPECT,'browser 17/17; task incomplete, 725 rows remain')
          PY
          git rm .github/workflows/task-record-online-state.yml
          test "$(git ls-remote origin refs/heads/docs/20260926-verified-field-state | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "eceaf9cfa45b02b469620e3d938b9f105dd93606"
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git commit -m 'docs: record verified deployed field increment and truthful remaining workload'
          git push origin HEAD:refs/heads/docs/20260926-verified-field-state
