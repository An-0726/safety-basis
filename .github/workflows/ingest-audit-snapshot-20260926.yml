name: Temporary 2026 ingestion source snapshot

on:
  push:
    branches: [maintenance/20260926-project-ingest]
    paths: [.github/workflows/ingest-audit-snapshot-20260926.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download hash-pinned read-only legacy workbook parser
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/audit-reader"
          python -m pip download --no-deps --only-binary=:all: --index-url https://pypi.org/simple xlrd==2.0.2 --dest "${RUNNER_TEMP}/audit-reader"
          cd "${RUNNER_TEMP}/audit-reader"
          echo 'ea762c3d29f4cca48d82df517b6d89fbce4db3107f9d78713e48cd321d5c9aa9  xlrd-2.0.2-py2.py3-none-any.whl' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-workbook-reader-xlrd-2.0.2
          path: ${{ runner.temp }}/audit-reader/*.whl
          if-no-files-found: error
          retention-days: 3
