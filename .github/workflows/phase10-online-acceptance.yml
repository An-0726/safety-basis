name: Phase 10 online acceptance

on:
  push:
    branches:
      - phase10-finalize-20260917
    paths:
      - .phase10-online-trigger

permissions:
  contents: read

jobs:
  online-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch deployed GitHub Pages files
        shell: bash
        run: |
          set -euo pipefail
          base="https://an-0726.github.io/safety-basis"
          for path in \
            index.html \
            library.html \
            release.json \
            data/manifest.json \
            site-manifest.json \
            data/search-index.json \
            data/law-index.json \
            data/fulltext/catalog.json \
            data/hazards/h0000.json \
            data/clauses/c0000.json
          do
            out="/tmp/$(echo "$path" | tr '/' '_')"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 3 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "${base}/${path}?phase10=${GITHUB_SHA}" \
              -o "$out"
            test -s "$out"
          done

      - name: Verify live release identity and public boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          EXPECTED_RELEASE = "552cca4f3e12877c7af1f56cd323220fe6af5631e4b334ffddb04881bbc83a07"
          EXPECTED_DATA_VERSION = "2026.09.16.3c486cba5142"

          def load(name):
              return json.loads(Path('/tmp/' + name).read_text(encoding='utf-8'))

          release = load('release.json')
          manifest = load('data_manifest.json')
          site = load('site-manifest.json')
          search = load('data_search-index.json')
          laws = load('data_law-index.json')
          catalog = load('data_fulltext_catalog.json')
          hazards = load('data_hazards_h0000.json').get('records', [])
          clauses = load('data_clauses_c0000.json').get('records', [])
          index_html = Path('/tmp/index.html').read_text(encoding='utf-8')
          library_html = Path('/tmp/library.html').read_text(encoding='utf-8')

          assert release['releaseHash'] == EXPECTED_RELEASE, release['releaseHash']
          assert manifest['releaseHash'] == EXPECTED_RELEASE, manifest['releaseHash']
          assert site['releaseHash'] == EXPECTED_RELEASE, site['releaseHash']
          assert manifest['dataVersion'] == EXPECTED_DATA_VERSION, manifest['dataVersion']
          assert release['counts'] == {
              'hazards': 1429,
              'laws': 57,
              'lawVersions': 57,
              'clauses': 1205,
              'links': 1544,
          }, release['counts']
          gate = release['knowledge']['gate']
          assert gate['eligibleHazards'] == 1429
          assert gate['eligibleLinks'] == 1544
          assert gate['strictBlockers'] == 0
          assert gate['publicProposalHazards'] == 0
          assert gate['candidateHazardsInKnowledge'] == 499
          assert len(search) == 1429
          assert all(row.get('publishable') is True for row in search)
          assert len(laws) == 57
          assert len(catalog['documents']) == 69
          assert sum(d.get('textMode') == 'full_text' for d in catalog['documents']) == 11
          assert sum(d.get('textMode') == 'link_only' for d in catalog['documents']) == 58
          assert hazards and clauses
          assert all(row.get('publishable') is True for row in hazards)
          assert '隐患速查' in index_html and '法规库' in index_html
          assert '法规全文' in library_html
          for term in ('消火栓', '灭火器', '安全生产法', '气瓶'):
              assert any(term in str(row.get('searchText', '')) for row in search), term
          private_markers = ('source/library', 'fulltext.sqlite3', 'archive/sha256', 'document-aliases.json', 'D:\\ESH', 'D:/ESH')
          payloads = [index_html, library_html] + [
              json.dumps(obj, ensure_ascii=False)
              for obj in (release, manifest, site, search, laws, catalog, hazards, clauses)
          ]
          assert not any(marker in payload for marker in private_markers for payload in payloads)
          print('LIVE_PHASE10_ACCEPTANCE=PASS')
          print('releaseHash=' + release['releaseHash'])
          print('dataVersion=' + manifest['dataVersion'])
          print('hazards=1429 clauses=1205 laws=57 links=1544 proposedPublic=0 catalog=69')
          PY
