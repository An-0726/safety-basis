name: Validate safety data

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild derived data
        run: node tools/build-data.mjs
      - name: Ensure generated data is committed
        run: git diff --exit-code -- data
