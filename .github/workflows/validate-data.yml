name: Validate safety data

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/pipeline/requirements.txt
      - name: Test the legacy public gate in isolated fixtures
        run: node --test tools/tests/*.test.mjs tests/*.test.mjs
      - name: Validate the V4 knowledge graph without rewriting public data
        run: python tools/v4/validate_all.py
      - name: Validate the selected reviewed release (format-aware)
        run: |
          BUNDLE=$(python -c "import json;print(json.load(open('source/releases/site-selection.json'))['bundle'])")
          if grep -q '"v4SchemaVersion"' "source/releases/${BUNDLE}/data/manifest.json"; then
            python tools/v4/gate_v4.py
            python tools/v4/strict_release_audit.py > "${{ runner.temp }}/strict-audit.json"
            python -c "import json,sys;d=json.loads('\n'.join(open(sys.argv[1],encoding='utf-8').read().splitlines()[1:]));assert d.get('strictVerdict')=='PASS' and d.get('blockerCount')==0, d" "${{ runner.temp }}/strict-audit.json"
            python -c "import json,sys;d=json.load(open(sys.argv[1]));assert d.get('strictVerdict')=='PASS' and d.get('blockerCount')==0, d" "${{ runner.temp }}/strict-audit.json"
            python tools/v4/verify_unified_bundle.py
          else
            python tools/pipeline/prepare_site.py --output "${{ runner.temp }}/reviewed-site"
            python tools/pipeline/manage.py verify-site --output "${{ runner.temp }}/reviewed-site"
          fi
      - name: Ensure validators do not mutate governed data
        run: git diff --exit-code -- knowledge data source/releases
