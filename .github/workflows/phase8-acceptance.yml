name: Phase 8 frontend and private-boundary acceptance

on:
  push:
    branches:
      - phase8-frontend-private-consistency-20260916
    paths:
      - .phase8-accept-trigger

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/pipeline/requirements.txt

      - name: Run frontend compatibility tests
        run: node --test tests/*.test.mjs

      - name: Run pipeline compatibility tests
        run: python -m unittest discover -s tools/pipeline/tests -v

      - name: Validate knowledge and strict gate
        run: |
          python tools/v4/validate_all.py
          python tools/v4/strict_release_audit.py

      - name: Build fresh public bundle
        shell: bash
        run: |
          rm -rf source/releases/current source/releases/site-selection.json
          DATA_VERSION="$(date -u +%Y.%m.%d).${GITHUB_SHA::12}.phase8"
          python tools/v4/build_unified_release.py --out source/releases/current --as-of "$(date -u +%F)" --data-version "${DATA_VERSION}"
          python tools/v4/verify_unified_bundle.py --bundle source/releases/current

      - name: Audit public frontend projection and canonical links
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          bundle = root / 'source/releases/current'
          data = bundle / 'data'
          load = lambda p: json.loads(Path(p).read_text(encoding='utf-8'))
          manifest = load(data / 'manifest.json')
          search = load(data / 'search-index.json')
          laws = load(data / 'law-index.json')
          catalog = load(data / 'fulltext/catalog.json')
          publication = load(root / 'source/publication/law-index.json')

          assert len(search) == manifest['counts']['hazards']
          assert len(laws) == manifest['counts']['lawVersions']
          assert all(x.get('status') == '已核验' for x in search)
          assert len({x['id'] for x in search}) == len(search)
          assert len({x['id'] for x in laws}) == len(laws)

          hazards = {}
          for shard in manifest['hazardShards']:
              payload = load(bundle / shard['url'])
              for row in payload['records']:
                  assert row['status'] == '已核验'
                  assert row.get('publishable') is True
                  assert row.get('lifecycle') == 'active'
                  hazards[row['id']] = row
          assert set(hazards) == {x['id'] for x in search}

          clauses = {}
          for shard in manifest['clauseShards']:
              payload = load(bundle / shard['url'])
              for row in payload['records']:
                  clauses[row['id']] = row
          law_ids = {x['id'] for x in laws}
          for hazard in hazards.values():
              assert hazard['basisRefs']
              for ref in hazard['basisRefs']:
                  clause = clauses[ref['clauseId']]
                  assert clause['lawId'] in law_ids

          for law in laws:
              for ref in law['clauseRefs']:
                  assert ref['clauseId'] in clauses
                  assert all(hid in hazards for hid in ref['hazardIds'])

          pub_ids = {x['id'] for x in publication}
          fulltext_ids = {x['versionId'] for x in catalog['documents']}
          assert fulltext_ids <= pub_ids
          assert len(catalog['documents']) == len(fulltext_ids)
          full = [x for x in catalog['documents'] if x['textMode'] == 'full_text']
          links = [x for x in catalog['documents'] if x['textMode'] == 'link_only']
          for doc in full:
              assert (data / 'fulltext' / doc['textPath']).is_file()
          assert len(full) == 11
          assert len(links) == 58

          forbidden = ('source/library/', 'fulltext.sqlite3', 'document-aliases.json')
          leaked = []
          for path in bundle.rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.json','.js','.html','.css','.webmanifest'}:
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  if any(mark in text for mark in forbidden):
                      leaked.append(path.relative_to(bundle).as_posix())
          assert not leaked, leaked

          report = {
              'phase': 8,
              'status': 'PASS',
              'publicHazards': len(hazards),
              'publicLawVersions': len(laws),
              'publicClauses': len(clauses),
              'fullTextDocuments': len(full),
              'officialLinkOnlyDocuments': len(links),
              'publicationCatalogDocuments': len(catalog['documents']),
              'proposedEntitiesPublished': 0,
              'privateBoundaryLeaks': 0,
              'allHazardClauseLawRefsResolve': True,
              'fulltextVersionIdsCanonical': True,
              'bundleVerified': True,
          }
          Path('docs/phase8-public-acceptance.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Ensure acceptance did not mutate governed sources
        run: git diff --exit-code -- knowledge source/publication web

      - name: Commit Phase 8 public acceptance report
        shell: bash
        run: |
          git config user.name "phase8-acceptance"
          git config user.email "phase8-acceptance@users.noreply.github.com"
          git add docs/phase8-public-acceptance.json
          git diff --cached --quiet && { echo 'No report change'; exit 1; }
          git commit -m "Phase 8: verify public frontend projection"
          git push
