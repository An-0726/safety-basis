name: Phase 8 frontend and private consistency

on:
  push:
    branches:
      - phase8-frontend-private-consistency-20260916
    paths:
      - .phase8-finalize-trigger

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/pipeline/requirements.txt

      - name: Test frontend and local private compatibility
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tools/pipeline/tests -v

      - name: Validate governed knowledge and strict gate
        run: |
          python tools/v4/validate_all.py
          python tools/v4/strict_release_audit.py

      - name: Build and verify fresh current frontend bundle
        shell: bash
        run: |
          rm -rf source/releases/current source/releases/site-selection.json
          DATA_VERSION="$(date -u +%Y.%m.%d).${GITHUB_SHA::12}.phase8"
          python tools/v4/build_unified_release.py --out source/releases/current --as-of "$(date -u +%F)" --data-version "${DATA_VERSION}"
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('source/releases/current/release.json').read_text(encoding='utf-8'))
          Path('source/releases/site-selection.json').write_text(
              json.dumps({
                  'schemaVersion':'safety-site-selection-v1',
                  'bundle':'current',
                  'releaseHash':release['releaseHash']
              }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          python tools/v4/verify_unified_bundle.py --bundle source/releases/current

      - name: Audit PHASE 8 public/frontend consistency
        run: python tools/maintenance/audit_phase8_consistency.py --bundle source/releases/current --output docs/phase8-public-audit.json

      - name: Verify private/public source boundaries stayed intact
        shell: bash
        run: |
          git diff --exit-code -- knowledge source/publication
          if git ls-files | grep -E '^(source/library/|dist/|source/releases/current/)' ; then
            echo "Private or generated paths are tracked" >&2
            exit 1
          fi
          git diff --check

      - name: Commit public PHASE 8 audit only
        shell: bash
        run: |
          git config user.name "phase8-finalizer"
          git config user.email "phase8-finalizer@users.noreply.github.com"
          git add docs/phase8-public-audit.json
          if git diff --cached --quiet; then
            echo "No PHASE 8 audit change to commit"
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^docs/phase8-public-audit\.json$' ; then
            echo "Unexpected staged path" >&2
            exit 1
          fi
          git commit -m "Phase 8: record public frontend audit"
          git push
