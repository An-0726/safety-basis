name: Final engineering QA (read only)
# rerun-after-remediation-20260921-v2
# rerun-after-remediation-20260921
on:
  push:
    branches: [audit/engineering-20260920]
    paths:
      - .github/workflows/final-engineering-qa.yml
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/engineering-20260920
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install -r tools/pipeline/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Full automated gates
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tools/pipeline/tests -v
          python tools/v4/validate_all.py
          python tools/v4/strict_release_audit.py
          python tools/v4/validate_publication_integrity.py
      - name: Comprehensive repository scanner
        run: |
          mkdir -p "${RUNNER_TEMP}/final-qa"
          python tools/v4/comprehensive_scanner.py | tee "${RUNNER_TEMP}/final-qa/comprehensive-scanner.log"
          cp docs/scan_findings.jsonl "${RUNNER_TEMP}/final-qa/scan_findings.jsonl"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/scan_findings.jsonl')
          rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          errors=[x for x in rows if x.get('severity')=='ERROR']
          warnings=[x for x in rows if x.get('severity')=='WARNING']
          print({'errors':len(errors),'warnings':len(warnings)})
          if errors:
              for row in errors[:50]: print(json.dumps(row,ensure_ascii=False))
              raise SystemExit(1)
          PY
      - name: Build isolated final QA bundle
        run: |
          rm -rf source/releases/final-qa
          python tools/v4/build_unified_release.py --out source/releases/final-qa --as-of 2026-09-21 --data-version "final-qa-${GITHUB_SHA}"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('source/releases/final-qa/release.json').read_text(encoding='utf-8'))
          Path('source/releases/final-qa-selection.json').write_text(json.dumps({'schemaVersion':'safety-site-selection-v1','bundle':'final-qa','releaseHash':r['releaseHash']},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python tools/v4/verify_unified_bundle.py --bundle source/releases/final-qa --selection source/releases/final-qa-selection.json
      - name: Full taxonomy audit
        run: |
          python tools/review/audit_public_taxonomy.py --bundle source/releases/final-qa --out-dir "${RUNNER_TEMP}/final-qa/taxonomy" --output-stem final-taxonomy
      - name: Strict Chromium acceptance
        run: |
          python tools/browser/audit_browser.py --bundle source/releases/final-qa --out "${RUNNER_TEMP}/final-qa/browser-local.json"
          python tools/browser/audit_browser.py --url https://an-0726.github.io/safety-basis/ --out "${RUNNER_TEMP}/final-qa/browser-public-observe.json" --observe
      - name: Capture source baseline
        if: always()
        run: |
          git status --porcelain=v1 > "${RUNNER_TEMP}/final-qa/git-status.txt"
          git rev-parse HEAD > "${RUNNER_TEMP}/final-qa/source-commit.txt"
          git log -20 --format='%H %aI %s' > "${RUNNER_TEMP}/final-qa/git-log.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-engineering-qa-evidence
          path: ${{ runner.temp }}/final-qa
          if-no-files-found: error
          retention-days: 7
