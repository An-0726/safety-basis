name: Build current verified website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/pipeline/requirements.txt
      - name: Validate knowledge and rebuild the only current package
        shell: bash
        run: |
          python tools/v4/validate_all.py
          python tools/v4/strict_release_audit.py
          python tools/v4/validate_publication_integrity.py
          rm -rf source/releases/current
          DATA_VERSION="$(date -u +%Y.%m.%d).${GITHUB_SHA::12}"
          python tools/v4/build_unified_release.py --out source/releases/current --as-of "$(date -u +%F)" --data-version "${DATA_VERSION}"
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('source/releases/current/release.json').read_text(encoding='utf-8'))
          Path('source/releases/site-selection.json').write_text(
              json.dumps({
                  'schemaVersion':'safety-site-selection-v1',
                  'bundle':'current',
                  'releaseHash':release['releaseHash']
              }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          python tools/v4/verify_unified_bundle.py --bundle source/releases/current
          mkdir -p "${{ runner.temp }}/current-site"
          cp -r source/releases/current/. "${{ runner.temp }}/current-site/"
      - uses: actions/upload-artifact@v4
        with:
          name: current-safety-site
          path: ${{ runner.temp }}/current-site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/current-site

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified current artifact
        id: deployment
        uses: actions/deploy-pages@v4
