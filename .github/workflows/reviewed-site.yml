name: Build current verified website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/pipeline/requirements.txt
      - name: Test frontend and pipeline before building the deployable package
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tools/pipeline/tests -v
      - name: Validate knowledge and rebuild the only current package
        shell: bash
        run: |
          python tools/v4/validate_all.py
          python tools/v4/strict_release_audit.py
          python tools/v4/validate_publication_integrity.py
          rm -rf source/releases/current
          BUILD_DATE="$(TZ=Asia/Shanghai date +%F)"
          DATA_VERSION="$(TZ=Asia/Shanghai date +%Y.%m.%d).${GITHUB_SHA::12}"
          python tools/v4/build_unified_release.py --out source/releases/current --as-of "${BUILD_DATE}" --data-version "${DATA_VERSION}"
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('source/releases/current/release.json').read_text(encoding='utf-8'))
          Path('source/releases/site-selection.json').write_text(
              json.dumps({
                  'schemaVersion':'safety-site-selection-v1',
                  'bundle':'current',
                  'releaseHash':release['releaseHash']
              }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          python tools/v4/verify_unified_bundle.py --bundle source/releases/current
          mkdir -p "${{ runner.temp }}/current-site"
          cp -r source/releases/current/. "${{ runner.temp }}/current-site/"
      - name: Preserve dated inventory diagnostics (strict Gate remains the publication blocker)
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/inventory-diagnostics"
          SNAPSHOT_DATE="$(python -c "import json; print(json.load(open('source/releases/current/release.json'))['asOf'])")"
          python tools/v4/comprehensive_scanner.py \
            --as-of "${SNAPSHOT_DATE}" \
            --output "${RUNNER_TEMP}/inventory-diagnostics/scan-findings.jsonl" \
            | tee "${RUNNER_TEMP}/inventory-diagnostics/scan-summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dated-inventory-diagnostics
          path: ${{ runner.temp }}/inventory-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Real Chromium acceptance of the exact new package
        timeout-minutes: 30
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          mkdir -p "${RUNNER_TEMP}/browser-local"
          python tools/browser/audit_browser.py \
            --bundle source/releases/current \
            --expected-commit "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/browser-local/browser.json"
      - name: Real Chromium ordinary tables in the exact new package
        if: success() || failure()
        run: |
          python tools/browser/audit_ordinary_tables.py \
            --bundle source/releases/current \
            --expected-commit "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/browser-local/ordinary-tables.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common-hazards-browser-local-evidence
          path: ${{ runner.temp }}/browser-local
          if-no-files-found: warn
          retention-days: 7
      - name: Upload focused reviewable browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-clause-browser-local-focused
          path: |
            ${{ runner.temp }}/browser-local/browser.json
            ${{ runner.temp }}/browser-local/ordinary-tables.json
            ${{ runner.temp }}/browser-local/ordinary-table-*.png
            ${{ runner.temp }}/browser-local/tsg-reading-*.png
            ${{ runner.temp }}/browser-local/recovery-screenshots/recovery-*-H053.png
            ${{ runner.temp }}/browser-local/recovery-screenshots/recovery-*-H054.png
            ${{ runner.temp }}/browser-local/recovery-screenshots/recovery-*-H055.png
            ${{ runner.temp }}/browser-local/recovery-screenshots/recovery-*-H_993643C76F7041BDA19B0C5EED.png
            ${{ runner.temp }}/browser-local/recovery-screenshots/recovery-*-H_D128C0FCC4844BD8BF5D8FAAF5.png
            ${{ runner.temp }}/browser-local/recovery-screenshots/recovery-*-H_8A733CAD776643E3B34B4D4689.png
            ${{ runner.temp }}/browser-local/recovery-screenshots/recovery-*-H_B0B7C75B5F0D423386A84AB73D.png
            ${{ runner.temp }}/browser-local/recovery-screenshots/recovery-*-H_CFF821DDE6764083BFB914EC86.png
            ${{ runner.temp }}/browser-local/recovery-screenshots/recovery-*-H_3141FAD634694686B722139F91.png
            ${{ runner.temp }}/browser-local/recovery-screenshots/recovery-*-H_C7284453E8E94532A44FC5F5EF.png
            ${{ runner.temp }}/browser-local/recovery-screenshots/recovery-*-H_974023DBBC2B471AA3F7DB6A67.png
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
      - uses: actions/upload-artifact@v4
        with:
          name: current-safety-site
          path: ${{ runner.temp }}/current-site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/current-site

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified current artifact
        id: deployment
        uses: actions/deploy-pages@v4

  online_verify:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium acceptance dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify deployed GitHub Pages with real Chromium
        timeout-minutes: 75
        run: |
          mkdir -p "${RUNNER_TEMP}/online-verify"
          for attempt in 1 2 3; do
            if python tools/browser/audit_browser.py \
              --url https://an-0726.github.io/safety-basis/ \
              --expected-commit "${GITHUB_SHA}" \
              --out "${RUNNER_TEMP}/online-verify/browser-public.json"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep 15
            fi
          done
          exit 1
      - name: Verify deployed ordinary tables with real Chromium
        if: success() || failure()
        run: |
          python tools/browser/audit_ordinary_tables.py \
            --url https://an-0726.github.io/safety-basis/ \
            --expected-commit "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/online-verify/ordinary-tables.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-site-browser-evidence
          path: ${{ runner.temp }}/online-verify
          if-no-files-found: warn
          retention-days: 7
      - name: Upload focused reviewable browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-clause-online-verify-focused
          path: |
            ${{ runner.temp }}/online-verify/browser-public.json
            ${{ runner.temp }}/online-verify/ordinary-tables.json
            ${{ runner.temp }}/online-verify/ordinary-table-*.png
            ${{ runner.temp }}/online-verify/tsg-reading-*.png
            ${{ runner.temp }}/online-verify/recovery-screenshots/recovery-*-H053.png
            ${{ runner.temp }}/online-verify/recovery-screenshots/recovery-*-H054.png
            ${{ runner.temp }}/online-verify/recovery-screenshots/recovery-*-H055.png
            ${{ runner.temp }}/online-verify/recovery-screenshots/recovery-*-H_993643C76F7041BDA19B0C5EED.png
            ${{ runner.temp }}/online-verify/recovery-screenshots/recovery-*-H_D128C0FCC4844BD8BF5D8FAAF5.png
            ${{ runner.temp }}/online-verify/recovery-screenshots/recovery-*-H_8A733CAD776643E3B34B4D4689.png
            ${{ runner.temp }}/online-verify/recovery-screenshots/recovery-*-H_B0B7C75B5F0D423386A84AB73D.png
            ${{ runner.temp }}/online-verify/recovery-screenshots/recovery-*-H_CFF821DDE6764083BFB914EC86.png
            ${{ runner.temp }}/online-verify/recovery-screenshots/recovery-*-H_3141FAD634694686B722139F91.png
            ${{ runner.temp }}/online-verify/recovery-screenshots/recovery-*-H_C7284453E8E94532A44FC5F5EF.png
            ${{ runner.temp }}/online-verify/recovery-screenshots/recovery-*-H_974023DBBC2B471AA3F7DB6A67.png
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
