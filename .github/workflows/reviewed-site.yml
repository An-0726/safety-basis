name: Build current verified website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/pipeline/requirements.txt
      - name: Test frontend and pipeline before building the deployable package
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tools/pipeline/tests -v
      - name: Validate knowledge and rebuild the only current package
        shell: bash
        run: |
          python tools/v4/validate_all.py
          python tools/v4/strict_release_audit.py
          python tools/v4/validate_publication_integrity.py
          rm -rf source/releases/current
          BUILD_DATE="$(TZ=Asia/Shanghai date +%F)"
          DATA_VERSION="$(TZ=Asia/Shanghai date +%Y.%m.%d).${GITHUB_SHA::12}"
          python tools/v4/build_unified_release.py --out source/releases/current --as-of "${BUILD_DATE}" --data-version "${DATA_VERSION}"
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('source/releases/current/release.json').read_text(encoding='utf-8'))
          Path('source/releases/site-selection.json').write_text(
              json.dumps({
                  'schemaVersion':'safety-site-selection-v1',
                  'bundle':'current',
                  'releaseHash':release['releaseHash']
              }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          python tools/v4/verify_unified_bundle.py --bundle source/releases/current
          mkdir -p "${{ runner.temp }}/current-site"
          cp -r source/releases/current/. "${{ runner.temp }}/current-site/"
      - name: Preserve dated inventory diagnostics (strict Gate remains the publication blocker)
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/inventory-diagnostics"
          SNAPSHOT_DATE="$(python -c "import json; print(json.load(open('source/releases/current/release.json'))['asOf'])")"
          python tools/v4/comprehensive_scanner.py \
            --as-of "${SNAPSHOT_DATE}" \
            --output "${RUNNER_TEMP}/inventory-diagnostics/scan-findings.jsonl" \
            | tee "${RUNNER_TEMP}/inventory-diagnostics/scan-summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dated-inventory-diagnostics
          path: ${{ runner.temp }}/inventory-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Real Chromium acceptance of the exact new package
        timeout-minutes: 75
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          mkdir -p "${RUNNER_TEMP}/browser-local"
          python tools/browser/audit_browser.py \
            --bundle source/releases/current \
            --expected-commit "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/browser-local/browser.json"
      - name: Real Chromium ordinary tables in the exact new package
        if: success() || failure()
        run: |
          python tools/browser/audit_ordinary_tables.py \
            --bundle source/releases/current \
            --expected-commit "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/browser-local/ordinary-tables.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common-hazards-browser-local-evidence
          path: ${{ runner.temp }}/browser-local
          if-no-files-found: warn
          retention-days: 7
      - name: Partition all current-batch focused evidence into bounded volumes
        id: focused_local
        if: always()
        run: |
          python tools/browser/package_focused_artifacts.py \
            --source "${{ runner.temp }}/browser-local" \
            --out "${{ runner.temp }}/browser-local-focused"
      - name: Upload focused evidence volume 01
        uses: actions/upload-artifact@v4
        if: always() && steps.focused_local.outputs.part_01 == 'true'
        with:
          name: complete-remaining-browser-local-part-01
          path: ${{ runner.temp }}/browser-local-focused/part-01
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload focused evidence volume 02
        uses: actions/upload-artifact@v4
        if: always() && steps.focused_local.outputs.part_02 == 'true'
        with:
          name: complete-remaining-browser-local-part-02
          path: ${{ runner.temp }}/browser-local-focused/part-02
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload focused evidence volume 03
        uses: actions/upload-artifact@v4
        if: always() && steps.focused_local.outputs.part_03 == 'true'
        with:
          name: complete-remaining-browser-local-part-03
          path: ${{ runner.temp }}/browser-local-focused/part-03
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload focused evidence volume 04
        uses: actions/upload-artifact@v4
        if: always() && steps.focused_local.outputs.part_04 == 'true'
        with:
          name: complete-remaining-browser-local-part-04
          path: ${{ runner.temp }}/browser-local-focused/part-04
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload focused evidence volume 05
        uses: actions/upload-artifact@v4
        if: always() && steps.focused_local.outputs.part_05 == 'true'
        with:
          name: complete-remaining-browser-local-part-05
          path: ${{ runner.temp }}/browser-local-focused/part-05
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload focused evidence volume 06
        uses: actions/upload-artifact@v4
        if: always() && steps.focused_local.outputs.part_06 == 'true'
        with:
          name: complete-remaining-browser-local-part-06
          path: ${{ runner.temp }}/browser-local-focused/part-06
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload focused evidence volume 07
        uses: actions/upload-artifact@v4
        if: always() && steps.focused_local.outputs.part_07 == 'true'
        with:
          name: complete-remaining-browser-local-part-07
          path: ${{ runner.temp }}/browser-local-focused/part-07
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload focused evidence volume 08
        uses: actions/upload-artifact@v4
        if: always() && steps.focused_local.outputs.part_08 == 'true'
        with:
          name: complete-remaining-browser-local-part-08
          path: ${{ runner.temp }}/browser-local-focused/part-08
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload focused evidence volume 09
        uses: actions/upload-artifact@v4
        if: always() && steps.focused_local.outputs.part_09 == 'true'
        with:
          name: complete-remaining-browser-local-part-09
          path: ${{ runner.temp }}/browser-local-focused/part-09
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload focused evidence volume 10
        uses: actions/upload-artifact@v4
        if: always() && steps.focused_local.outputs.part_10 == 'true'
        with:
          name: complete-remaining-browser-local-part-10
          path: ${{ runner.temp }}/browser-local-focused/part-10
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - uses: actions/upload-artifact@v4
        with:
          name: current-safety-site
          path: ${{ runner.temp }}/current-site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/current-site

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified current artifact
        id: deployment
        uses: actions/deploy-pages@v4

  online_verify:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium acceptance dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify deployed GitHub Pages with real Chromium
        timeout-minutes: 75
        run: |
          mkdir -p "${RUNNER_TEMP}/online-verify"
          for attempt in 1 2 3; do
            if python tools/browser/audit_browser.py \
              --url https://an-0726.github.io/safety-basis/ \
              --expected-commit "${GITHUB_SHA}" \
              --out "${RUNNER_TEMP}/online-verify/browser-public.json"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep 15
            fi
          done
          exit 1
      - name: Verify deployed ordinary tables with real Chromium
        if: success() || failure()
        run: |
          python tools/browser/audit_ordinary_tables.py \
            --url https://an-0726.github.io/safety-basis/ \
            --expected-commit "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/online-verify/ordinary-tables.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-site-browser-evidence
          path: ${{ runner.temp }}/online-verify
          if-no-files-found: warn
          retention-days: 7
      - name: Partition all current-batch focused evidence into bounded volumes
        id: focused_online
        if: always()
        run: |
          python tools/browser/package_focused_artifacts.py \
            --source "${{ runner.temp }}/online-verify" \
            --out "${{ runner.temp }}/online-verify-focused"
      - name: Upload focused evidence volume 01
        uses: actions/upload-artifact@v4
        if: always() && steps.focused_online.outputs.part_01 == 'true'
        with:
          name: complete-remaining-online-verify-part-01
          path: ${{ runner.temp }}/online-verify-focused/part-01
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload focused evidence volume 02
