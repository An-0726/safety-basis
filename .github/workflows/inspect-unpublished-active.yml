name: Inspect unpublished active hazards (read only)
on:
  push:
    branches: [audit/engineering-20260920]
    paths:
      - tools/audit/inspect_unpublished_active.py
      - .github/workflows/inspect-unpublished-active.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/engineering-20260920
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit/inspect_unpublished_active.py
