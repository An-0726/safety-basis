name: Engineering audit (isolated)

on:
  push:
    branches: [audit/engineering-20260920]

permissions:
  contents: read

concurrency:
  group: engineering-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r tools/pipeline/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Capture committed source and Git baseline
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/engineering-audit"
          git status --porcelain=v1 > "${RUNNER_TEMP}/engineering-audit/git-status.txt"
          git branch --show-current > "${RUNNER_TEMP}/engineering-audit/git-branch.txt"
          git log -20 --format='%H %aI %s' > "${RUNNER_TEMP}/engineering-audit/git-log.txt"
          git rev-parse HEAD > "${RUNNER_TEMP}/engineering-audit/source-commit.txt"
          git archive --format=zip HEAD -o "${RUNNER_TEMP}/engineering-audit/source.zip"
          python -m pip freeze > "${RUNNER_TEMP}/engineering-audit/dependencies.txt"
      - name: Unit tests and baseline gates
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tools/pipeline/tests -v
          python tools/v4/validate_all.py
          python tools/v4/strict_release_audit.py
          python tools/v4/validate_publication_integrity.py
      - name: Build isolated test bundle
        run: |
          # Preserve the production verifier contract in this isolated checkout.
          python tools/v4/build_unified_release.py --out source/releases/audit --as-of "$(date -u +%F)" --data-version "audit-${GITHUB_SHA}"
          python - <<'PY_SELECTION'
          import json
          from pathlib import Path
          release = json.loads(Path('source/releases/audit/release.json').read_text(encoding='utf-8'))
          selection = {'schemaVersion': 'safety-site-selection-v1', 'bundle': 'audit', 'releaseHash': release['releaseHash']}
          Path('source/releases/audit-selection.json').write_text(json.dumps(selection, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY_SELECTION
          python tools/v4/verify_unified_bundle.py --bundle source/releases/audit --selection source/releases/audit-selection.json
          cp -a source/releases/audit "${RUNNER_TEMP}/engineering-audit/bundle"
      - name: Observe baseline browser defects
        run: |
          python tools/browser/audit_browser.py --bundle "${RUNNER_TEMP}/engineering-audit/bundle" --out "${RUNNER_TEMP}/engineering-audit/browser-local.json" --observe
          python tools/browser/audit_browser.py --url https://an-0726.github.io/safety-basis/ --out "${RUNNER_TEMP}/engineering-audit/browser-public.json" --observe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-audit-evidence
          path: ${{ runner.temp }}/engineering-audit
          if-no-files-found: error
          retention-days: 7
