name: Apply release-order regression fix
on:
  push:
    branches: [fix/20260926-release-order]
    paths: [.github/workflows/task-release-order.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed two-file patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/20260926-release-order"
          test "$(git rev-parse HEAD^)" = "520023209c9329cf76ffb5fdc24728163e56f84d"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "520023209c9329cf76ffb5fdc24728163e56f84d"
          python - <<'PY'
          import base64,hashlib,lzma,os,pathlib,subprocess
          encoded=''
          patch=lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='31b8e37604786ee804fe263314ba183a7309f105ff9c4d846eae15e99acadec7'
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'release-order.patch';p.write_bytes(patch)
          subprocess.run(['git','apply','--index','--check',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'tools/v4/build_unified_release.py','tools/pipeline/tests/test_unified_release_reproducibility.py'}
          PY
          git rm .github/workflows/task-release-order.yml
          python -m pip install -r tools/pipeline/requirements.txt
          python -m unittest discover -s tools/pipeline/tests -v
          python tools/v4/validate_all.py
          test "$(git ls-remote origin refs/heads/fix/20260926-release-order | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "520023209c9329cf76ffb5fdc24728163e56f84d"
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git commit -m 'fix: stabilize basis ordering and clause shards across release builds'
          git push origin HEAD:refs/heads/fix/20260926-release-order
